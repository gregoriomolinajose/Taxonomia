<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prototipo Filtros S54.2</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #F4F5F7; margin: 0; padding: 50px; }
    .btn-test { padding: 10px 20px; font-size: 1rem; background: #0052CC; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .btn-test:hover { background: #0047B3; }
    .debug-panel { margin-top: 20px; background: #FFF; padding: 20px; border-radius: 8px; border: 1px solid #DFE1E6; min-height: 100px; font-family: monospace; white-space: pre-wrap; }
  </style>
  <script src="../src/UI_UniversalFilter.client.js"></script>
</head>
<body>
  <h1>Validación S54.2 (Lógica Dinámica)</h1>
  <button class="btn-test" onclick="openDrawer()">Abrir Filtros</button>
  
  <div class="debug-panel">
    <h3>Estado Emitido (onFilterChange):</h3>
    <div id="debug-output">{}</div>
  </div>

  <div id="drawer-container"></div>

  <!-- Inyección del CSS y renderizado -->
  <iframe src="../src/CSS_UniversalFilter.html" style="display:none;" onload="injectPrototype(this)"></iframe>

  <script>
    const MOCK_SCHEMAS = {
        'Personas': {
            fields: [
                { name: 'nombre', label: 'Nombre', type: 'text' },
                { name: 'departamento', label: 'Departamento', type: 'select_single' },
                { name: 'habilidades', label: 'Habilidades', type: 'select_multiple' },
                { name: 'oculto', hidden: true },
                { name: 'separador', type: 'divider' }
            ]
        }
    };

    const MOCK_RECORDS = [
        { nombre: 'Alice', departamento: 'Ingeniería', habilidades: ['React', 'Node'] },
        { nombre: 'Bob', departamento: 'Ingeniería', habilidades: ['Python', 'SQL'] },
        { nombre: 'Charlie', departamento: 'Ventas', habilidades: [] },
        { nombre: 'Dave', departamento: '', habilidades: ['Ventas'] }
    ];

    let filterInstance;

    function injectPrototype(iframe) {
        // Extraer CSS
        const style = iframe.contentDocument.querySelector('style').innerHTML;
        const styleTag = document.createElement('style');
        styleTag.innerHTML = style;
        document.head.appendChild(styleTag);
        
        // Instanciar Motor de Filtros
        filterInstance = new UI_UniversalFilter({
            entityName: 'Personas',
            schemaConfig: MOCK_SCHEMAS,
            records: MOCK_RECORDS,
            containerEl: document.getElementById('drawer-container'),
            onFilterChange: (newState) => {
                document.getElementById('debug-output').innerText = JSON.stringify(newState, null, 2);
            }
        });
    }

    function openDrawer() {
        if (filterInstance) {
            filterInstance.render();
        }
    }
  </script>
</body>
</html>
