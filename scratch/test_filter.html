<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prototipo Filtros S54.1</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #F4F5F7; margin: 0; padding: 50px; }
    .btn-test { padding: 10px 20px; font-size: 1rem; background: #0052CC; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .btn-test:hover { background: #0047B3; }
  </style>
  <script src="../src/UI_UniversalFilter.client.js"></script>
</head>
<body>
  <h1>Validación S54.1</h1>
  <button class="btn-test" onclick="openDrawer()">Abrir Filtros</button>
  
  <div id="drawer-container"></div>

  <!-- Inyección del CSS y renderizado -->
  <iframe src="../src/CSS_UniversalFilter.html" style="display:none;" onload="injectPrototype(this)"></iframe>

  <script>
    function injectPrototype(iframe) {
        // Extraer CSS
        const style = iframe.contentDocument.querySelector('style').innerHTML;
        const styleTag = document.createElement('style');
        styleTag.innerHTML = style;
        document.head.appendChild(styleTag);
        
        // Renderizar Skeleton
        document.getElementById('drawer-container').innerHTML = UI_UniversalFilter.renderDrawerSkeleton();
        
        // Asignar eventos de cierre
        document.getElementById('txFilterCloseBtn').onclick = closeDrawer;
        document.getElementById('txFilterOverlay').onclick = closeDrawer;
    }

    function openDrawer() {
        document.getElementById('txFilterDrawer').classList.add('active');
        document.getElementById('txFilterOverlay').classList.add('active');
    }

    function closeDrawer() {
        document.getElementById('txFilterDrawer').classList.remove('active');
        document.getElementById('txFilterOverlay').classList.remove('active');
    }
  </script>
</body>
</html>
