<script>
/**
 * UI_Component_MicroserviceSetup
 * Componente UI de solo lectura que instruye al administrador de otro dominio
 * cómo desplegar el Microservicio Puente y qué URL debe pegar arriba.
 */
(function(global) {

    global.UI_MicroserviceSetup = {
        render: function(field, entityName, data, eventBus, currentEditId) {
            const container = document.createElement('div');
            container.style.marginTop = "20px";
            container.style.padding = "20px";
            container.style.border = "1px solid var(--ion-color-light-shade)";
            container.style.borderRadius = "8px";
            container.style.backgroundColor = "var(--ion-color-light)";
            
            const microserviceCode = `
/**
 * TAXONOMIA OMR - MICROSERVICIO PUENTE
 * Despliega esto como Aplicación Web (Ejecutar como: Tú, Acceso: Cualquiera).
 */
function doGet(e) {
  var q = e.parameter.q || '';
  var secret = e.parameter.secret;
  
  // Cambia 'tu_password_aqui' por una contraseña segura y pégala en Taxonomía
  var EXPECTED_SECRET = 'tu_password_aqui';
  
  if (secret !== EXPECTED_SECRET) {
    return ContentService.createTextOutput(JSON.stringify({error: "No autorizado"}))
        .setMimeType(ContentService.MimeType.JSON);
  }

  try {
    var response = AdminDirectory.Users.list({
      customer: 'my_customer',
      query: "name:" + q + "*",
      maxResults: 15,
      projection: "full",
      viewType: "domain_public"
    });
    return ContentService.createTextOutput(JSON.stringify(response.users || []))
        .setMimeType(ContentService.MimeType.JSON);
  } catch(err) {
    return ContentService.createTextOutput(JSON.stringify({error: err.message}))
        .setMimeType(ContentService.MimeType.JSON);
  }
}
`.trim();

            container.innerHTML = `
                <h3 style="margin-top:0; color: var(--ion-color-dark);">¿Cómo conectar este dominio? (Microservicio Puente)</h3>
                <p style="font-size: 14px; color: var(--ion-color-medium);">
                    Para que Taxonomía pueda buscar usuarios en este dominio sin romper las políticas de seguridad de GCP,
                    el Administrador de este dominio debe seguir estos 3 pasos:
                </p>
                <ol style="font-size: 14px; color: var(--ion-color-dark);">
                    <li>Ir a <a href="https://script.google.com/home/start" target="_blank">Google Apps Script</a> y crear un "Nuevo Proyecto".</li>
                    <li>Pegar el siguiente código, cambiando <code>tu_password_aqui</code> por una contraseña inventada.</li>
                    <li>Hacer clic en <b>Implementar > Nueva Implementación</b>, elegir tipo <b>Aplicación Web</b>, ejecutar como <b>Él mismo</b> y acceso a <b>Cualquiera</b>.</li>
                </ol>
                <p style="font-size: 14px; color: var(--ion-color-medium);">
                    Al finalizar, Google le dará una <b>URL de Aplicación Web</b>. Deberá pegar esa URL en el campo "Webhook URL" de arriba,
                    y la contraseña inventada en el campo "Webhook Token".
                </p>
                
                <div style="position:relative; margin-top:15px;">
                    <textarea readonly style="width: 100%; height: 280px; font-family: monospace; font-size: 12px; padding: 10px; background: #2d2d2d; color: #f8f8f2; border-radius: 4px; border: none;">${microserviceCode}</textarea>
                </div>
            `;
            
            return container;
        }
    };

})(window);
</script>
