<script>
/**
 * UI_Component_OAuthDelegation.client.js
 * 
 * Componente renderizador para la delegación OAuth2 en la vista de Workspaces.
 * (Backend-Driven Flow via Auth_OAuth2.js)
 */
(function(window) {
    
    const UI_OAuthDelegation = {
        render: function(field, entityName, data, eventBus, contextId) {
            const container = document.createElement('div');
            container.style.width = '100%';
            container.style.marginBottom = 'var(--spacing-4)';
            container.style.padding = 'var(--spacing-4)';
            container.style.border = '1px solid var(--ion-color-step-200)';
            container.style.borderRadius = 'var(--rounded-md)';
            container.style.background = 'var(--ion-color-step-50)';
            container.style.display = 'none'; // Se oculta por defecto
            
            const title = document.createElement('h3');
            title.textContent = 'Integración de Directorio Segura';
            title.style.marginTop = '0';
            title.style.fontSize = 'var(--sys-font-medium)';
            
            const desc = document.createElement('p');
            desc.textContent = 'Para sincronizar usuarios de este dominio, debes autorizar el acceso mediante Google Workspace. La conexión se realizará en una pestaña segura gestionada por el servidor.';
            desc.style.fontSize = 'var(--sys-font-small)';
            desc.style.color = 'var(--ion-color-medium)';
            
            const btn = document.createElement('ion-button');
            btn.setAttribute('color', 'primary');
            btn.setAttribute('fill', 'solid');
            btn.innerHTML = '<ion-icon slot="start" name="logo-google"></ion-icon> Obtener Enlace de Conexión';
            
            container.appendChild(title);
            container.appendChild(desc);
            container.appendChild(btn);

            // Determinar visibilidad según el checkbox
            const checkVisibility = (isActive) => {
                if (isActive && String(isActive) !== "false") {
                    container.style.display = 'block';
                } else {
                    container.style.display = 'none';
                }
            };
            
            // Initial Check
            if (data && data.activar_consulta_directorio) {
                checkVisibility(data.activar_consulta_directorio);
            }

            // Escuchar cambios en el formulario
            if (eventBus) {
                eventBus.addEventListener('FIELD_CHANGED_activar_consulta_directorio', (e) => {
                    checkVisibility(e.detail.value);
                });
            }
            
            btn.addEventListener('click', async () => {
                btn.disabled = true;
                btn.innerHTML = '<ion-spinner name="crescent" slot="start"></ion-spinner> Generando URL...';
                
                try {
                    // Llamada segura al Backend
                    if (!window.DataAPI || !window.DataAPI.rpc) {
                        throw new Error("DataAPI no disponible");
                    }

                    const responseUrl = await window.DataAPI.rpc('Auth_GetWorkspaceAuthUrl', []);
                    
                    if (responseUrl) {
                        window.open(responseUrl, '_blank');
                        btn.innerHTML = '<ion-icon slot="start" name="checkmark-circle"></ion-icon> Revisa la nueva pestaña';
                        btn.setAttribute('color', 'success');
                        if (window.UI_Factory && window.UI_Factory.showToast) {
                            window.UI_Factory.showToast('Autoriza la aplicación en la pestaña que se acaba de abrir.', 'success');
                        }
                    } else {
                        throw new Error("El servidor no devolvió una URL válida.");
                    }
                } catch(e) {
                    console.error("Error obteniendo Auth URL", e);
                    btn.disabled = false;
                    btn.innerHTML = '<ion-icon slot="start" name="alert-circle"></ion-icon> Reintentar Conexión';
                    btn.setAttribute('color', 'danger');
                    if (window.UI_Factory && window.UI_Factory.showToast) {
                        window.UI_Factory.showToast('Error de conexión con el backend: ' + e.message, 'danger');
                    }
                }
            });

            return container;
        }
    };
    
    window.UI_OAuthDelegation = UI_OAuthDelegation;
    
})(window);
</script>
