content:
  summary: 'Fail-fast schema format validation in Engine_ETL to prevent processing invalid Google Sheets uploads.'
  complexity: simple
  acceptance_criteria:
    - id: AC1
      description: 'Engine_ETL.extractDataFromDrive throws an Error when maxOverlap <= 0 and schema exists.'
      verifiable: true
    - id: AC2
      description: 'The validation happens before extracting the actual data rows.'
      verifiable: true
  integration_points:
    - module: 'src.Engine_ETL'
      change_type: modification
      files: ['src/Engine_ETL.js']
  decisions:
    - id: D1
      choice: 'Throw Error explicitly instead of returning an empty array.'
      rationale: 'Failing fast with a clear message helps users immediately correct the file instead of wondering why no data was imported.'
      alternatives_considered: ['Return an empty array and let the caller handle it.']
