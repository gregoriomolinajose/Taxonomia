skill: rai-story-design
created: '2026-04-24T22:20:00Z'
story: 'S44.18'
epic: 'E44'
content:
  summary: 'Reducir la latencia y la saturación de memoria de Job_WorkspaceSync reemplazando lecturas masivas en RAM por queries filtrados en base de datos, y escrituras iterativas O(N) por escrituras en lote (Bulk Inserts).'
  complexity: moderate
  acceptance_criteria:
    - id: AC1
      description: 'Filtrado Server-Side: Job_WorkspaceSync descarga solo las personas pendientes/fallidas.'
      verifiable: true
    - id: AC2
      description: 'Escritura Masiva: Se eliminan las 50 peticiones de red por un par de llamadas upsertBatch (Entidad + Grafo).'
      verifiable: true
    - id: AC3
      description: 'Preservación Topológica: Las aristas creadas en lote mantienen el versionamiento SCD-2.'
      verifiable: true
  integration_points:
    - module: 'Backend_Jobs'
      change_type: modification
      files: ['src/Job_WorkspaceSync.js']
    - module: 'Backend_Engine'
      change_type: modification
      files: ['src/Engine_DB.js']
    - module: 'Backend_Adapter'
      change_type: modification
      files: ['src/Adapter_Sheets.js']
    - module: 'Backend_Topology'
      change_type: modification
      files: ['src/Topology_Strategies.js']
  decisions:
    - id: D1
      choice: 'Mantener lógica de SCD-2 extraída en Topology_Strategies en lugar de duplicarla.'
      rationale: 'upsertBatch procesa los datos de forma plana. Extraer la lógica SCD-2 desde orchestrateNestedSave hacia una función pura (calculateSCD2Transitions) evita duplicación de reglas de negocio topológicas (Resolución de H10).'
      alternatives_considered: ['Duplicar lógica en Job_WorkspaceSync', 'Sobrecargar upsertBatch']
    - id: D2
      choice: 'Filtrado Server-Side mediante Lambda Crudo (rawFilterFn) en Adapter_Sheets.'
      rationale: 'Evita crear un mini-ORM complejo para un entorno sin motor SQL como Google Sheets. Filtrar el arreglo 2D antes de mapear ahorra RAM sin agregar abstracciones innecesarias (Resolución de H7).'
      alternatives_considered: ['Crear método query con objetos de filtro estilo Mongo', 'Cargar todo y filtrar en memoria']
