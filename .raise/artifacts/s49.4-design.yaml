content:
  summary: 'Inyección de Wizard_Taxonomia en el portal de SelfService a través de una ruta nativa a pantalla completa y rediseño de portal estilo Landing Page (iOS).'
  complexity: medium
  acceptance_criteria:
    - id: AC1
      description: 'El diseño del Self Service usa gradientes difusos (blurs), fondo claro y tipografía bold estilo iOS.'
      verifiable: true
    - id: AC2
      description: 'El clic en el CTA navega a una nueva ruta nativa (viewType: wizard) en vez de abrir un modal modal.'
      verifiable: true
    - id: AC3
      description: 'Dentro de la ruta "wizard" se oculta la barra lateral y se renderiza el FormRenderer_UI a pantalla completa.'
      verifiable: true
    - id: AC4
      description: 'Al completarse el wizard con éxito, el enrutador captura el evento global y retorna automáticamente al portal de inicio (Self Service).'
      verifiable: true
  integration_points:
    - module: 'UI_Router'
      change_type: modification
      files: ['src/UI_Router.client.js']
    - module: 'SelfService_Home'
      change_type: modification
      files: ['src/SelfService_Home_UI.client.js']
    - module: 'FormSubmitter'
      change_type: modification
      files: ['src/UI_FormSubmitter.client.js']
  decisions:
    - id: D1
      choice: 'Transición a Vista Dedicada Nativa en lugar de Modal.'
      rationale: 'El Modal restringe la usabilidad y el espacio disponible para una inserción masiva de datos como lo es el Wizard. La vista nativa ofrece una experiencia de pantalla completa sin limitaciones.'
